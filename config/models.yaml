# 模型設定（使用者於 2026-10-13 決定）。改模型只要改這裡；每筆標註都會記錄實際使用的模型。
#
# service_tier：flex＝同步呼叫、批次價（可能回 429，會重試後退回 default）
#               batch＝Batch API（半價，24 小時內完成，下一次排程收回結果）
#               default＝標準價
tasks:
  stage1:            # 篩選＋分類＋摘要
    model: gpt-6-luna
    reasoning_effort: low
    service_tier: flex
    max_output_tokens: 2500
  stage2:            # 語氣、綠藍、抗中友中（第 2 週以金標準比對 gpt-6.1-sol / gpt-6-astra 再定案）
    model: gpt-6-luna
    reasoning_effort: medium
    service_tier: batch
    max_output_tokens: 6000
  embed:             # 事件分群
    model: text-embedding-3-large
    dimensions: 1024
  synth:             # 事件命名、子議題發現與整併
    model: gpt-6.1-sol
    reasoning_effort: low
    service_tier: flex
    max_output_tokens: 6000

# 每 1M tokens 的美元價格（標準價；flex／batch 以 50% 計）。來源：developers.openai.com/api/docs/pricing（2026-10-13）
pricing:
  gpt-6-luna: {input: 0.10, cached: 0.01, cache_write: 0.125, output: 0.50}
  gpt-6-sol: {input: 2.00, cached: 0.20, cache_write: 2.50, output: 10.00}
  gpt-6.1-sol: {input: 2.00, cached: 0.10, cache_write: 2.50, output: 10.00}
  gpt-6-astra: {input: 10.00, cached: 1.00, cache_write: 12.50, output: 50.00}
  gpt-5.6-luna: {input: 0.20, cached: 0.02, cache_write: 0.25, output: 1.20}
  gpt-4.1-mini: {input: 0.40, cached: 0.10, output: 1.60}
  text-embedding-3-large: {input: 0.13}
  text-embedding-3-small: {input: 0.02}

# 成本防護：當日（台北時間）累計超過上限就停止所有 LLM 呼叫。
budget:
  daily_usd: 5.0

# 每次排程最多處理幾篇（避免第一次執行或積壓時一次花太多錢）
limits:
  stage1_per_run: 400
  stage2_per_run: 400
