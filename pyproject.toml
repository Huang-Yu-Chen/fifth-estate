[project]
name = "fifth-estate"
version = "0.1.0"
description = "第五權 The Fifth Estate — Taiwanese political news polarization tracker"
readme = "README.md"
authors = [
    { name = "Yuchen", email = "yuchenhuang0216@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasketch>=2.0.0",
    "duckdb>=1.5.6",
    "feedparser>=6.0.14",
    "httpx[http2]>=0.28.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "selectolax>=1.0.0",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
]

[project.scripts]
fifth = "fifth_estate.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
